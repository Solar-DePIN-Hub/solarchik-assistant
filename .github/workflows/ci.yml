name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache
          key: tsc-${{ hashFiles('tsconfig.json', 'src/**/*.ts', 'src/**/*.tsx', 'server/**/*.ts', 'server/**/*.mjs') }}
          restore-keys: tsc-
      - run: npm ci
      - run: npm test

  worker:
    name: Worker tests (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker unit tests
        working-directory: worker
        run: node --test *.test.mjs

  android:
    name: Android unit tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/solarchik-handoff/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
      - name: Debug build
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: artifacts/solarchik-handoff/android/app/build/reports
